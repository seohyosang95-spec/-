<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 및 문구 편집기</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e2e8f0;
      --text: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: center; }
    button, label.btn { background: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.9rem; }
    button:hover, label.btn:hover { background: var(--primary-dark); }
    input[type="file"] { display: none; }
    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid var(--border); border-radius: 6px; margin-top: 8px; resize: vertical; }
    .canvas-container { display: flex; justify-content: center; background: #0f172a; padding: 20px; border-radius: 8px; }
    canvas { max-width: 100%; height: auto; background: #ffffff; }
    .status-msg { margin-top: 8px; font-size: 0.85rem; font-weight: bold; color: #64748b; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎨 이미지 및 문구 편집기</h2>

    <div class="card">
      <div class="controls">
        <label class="btn" for="imageInput">🖼️ 배경 이미지 업로드</label>
        <input type="file" id="imageInput" accept="image/*">

        <label class="btn" for="jsonInput" style="background:#475569;">📁 JSON 템플릿 불러오기</label>
        <input type="file" id="jsonInput" accept=".json">

        <button onclick="exportJSON()">💾 JSON 템플릿 저장</button>
      </div>

      <div>
        <label><strong>문구 입력:</strong></label>
        <textarea id="textInput" placeholder="캔버스에 표시할 문구를 입력하세요...">기존 템플릿 문구</textarea>
      </div>
      <p id="statusMessage" class="status-msg">상태: 정상 작동 중</p>
    </div>

    <div class="card canvas-container">
      <canvas id="mainCanvas" width="600" height="600"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const textInput = document.getElementById('textInput');
    const imageInput = document.getElementById('imageInput');
    const jsonInput = document.getElementById('jsonInput');
    const statusMsg = document.getElementById('statusMessage');

    // 현재 애플리케이션 상태 (100% 보존 대상)
    let state = {
      imageUrl: null,
      text: "기존 템플릿 문구",
      aspectRatio: "1:1"
    };

    let bgImage = null;

    // 캔버스 렌더링 함수
    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (state.text) {
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        
        // 다중 줄바꿈(\n) 처리
        const lines = state.text.split('\n');
        lines.forEach((line, index) => {
          ctx.fillText(line, canvas.width / 2, canvas.height / 2 + (index * 36));
        });
      }
    }

    // 텍스트 변경 이벤트 Listener
    textInput.addEventListener('input', (e) => {
      state.text = e.target.value;
      renderCanvas();
    });

    // 이미지 업로드 이벤트 Listener
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          bgImage = img;
          state.imageUrl = event.target.result;
          renderCanvas();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 핵심 예외 처리: JSON 불러오기 (T03-C23, T03-C24)
    jsonInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        let parsedData;

        // [T03-C23] 손상된 JSON (구문/괄호/쉼표 오류) 차단
        try {
          parsedData = JSON.parse(event.target.result);
        } catch (error) {
          alert("거부됨 (T03-C23): 유효하지 않은 JSON 문법 형식입니다.");
          statusMsg.innerText = "상태: [손상 JSON 거부] 기존 작업 상태 100% 유지됨.";
          statusMsg.style.color = "#b91c1c";
          jsonInput.value = ""; // 파일 선택 초기화
          return; // 조기 종료로 기존 state 100% 보존
        }

        // [T03-C24] 필수 키 누락 검증 (imageUrl 등)
        const requiredKeys = ["imageUrl", "text", "aspectRatio"];
        const missingKeys = requiredKeys.filter(key => !(key in parsedData));

        if (missingKeys.length > 0) {
          alert(`유효성 검사 실패 (T03-C24): 필수 키가 누락되었습니다. (${missingKeys.join(", ")})`);
          statusMsg.innerText = `상태: [누락 JSON 거부] 필수키(${missingKeys.join(", ")}) 누락으로 기존 작업 상태 100% 유지됨.`;
          statusMsg.style.color = "#b91c1c";
          jsonInput.value = ""; // 파일 선택 초기화
          return; // 조기 종료로 기존 state 100% 보존
        }

        // 모든 검증 통과 시 상태 복원
        state = parsedData;
        textInput.value = state.text;

        if (state.imageUrl) {
          const img = new Image();
          img.onload = () => {
            bgImage = img;
            renderCanvas();
          };
          img.src = state.imageUrl;
        } else {
          bgImage = null;
          renderCanvas();
        }

        statusMsg.innerText = "상태: JSON 템플릿이 성공적으로 적용되었습니다.";
        statusMsg.style.color = "#15803d";
        jsonInput.value = "";
      };

      reader.readAsText(file);
    });

    // JSON 내보내기 함수
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "template.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 초기 렌더링
    renderCanvas();
  </script>
</body>
</html>
