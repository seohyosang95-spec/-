<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프리미엄 템플릿 & 이미지 스튜디오 QA</title>
  <style>
    /* --------------------------------------------------
       1. 해상도 대응 및 가로 스크롤 방지 (1366x768 / 1920x1080)
       -------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      max-width: 100vw;
      overflow-x: hidden; /* 가로 스크롤 완전 방지 */
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1920px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: #1e1e2f;
      color: #fff;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Toolbar */
    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 12px;
      border-right: 1px solid #ddd;
    }
    .tool-group:last-child {
      border-right: none;
    }

    /* --------------------------------------------------
       2. 키보드 접근성 (포커스 표시)
       -------------------------------------------------- */
    a.btn-theme, button, select, input {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    a.btn-theme:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid #4A90E2;
      outline-offset: 2px;
    }

    /* Main Section */
    main {
      flex: 1;
      display: flex;
      gap: 20px;
      padding: 20px;
    }
    .canvas-panel, .preview-panel {
      flex: 1;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 10px 16px;
      background: #f8f9fa;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
    }
    .canvas-body {
      flex: 1;
      position: relative;
      min-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
    }
    #main-canvas {
      width: 80%;
      height: 80%;
      border: 2px dashed #bbb;
      position: relative;
      background-color: #ffffff;
      transition: background 0.3s;
    }

    /* Footer / System Status */
    footer {
      background: #1e1e2f;
      color: #00ffcc;
      padding: 8px 20px;
      font-size: 0.85rem;
      font-family: monospace;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div>프리미엄 템플릿 & 이미지 스튜디오 QA</div>
  </header>

  <!-- 툴바 영역 (접근성 role/tabindex 적용) -->
  <div class="toolbar">
    <!-- 배경 설정 -->
    <div class="tool-group">
      <a role="button" tabindex="0" class="btn-theme" onclick="setBg('#ffffff')" onkeydown="handleKeyClick(event, () => setBg('#ffffff'))">⚪ 흰색 단색</a>
      <a role="button" tabindex="0" class="btn-theme" onclick="setBg('#121212')" onkeydown="handleKeyClick(event, () => setBg('#121212'))">⬛ 다크 단색</a>
      <a role="button" tabindex="0" class="btn-theme" onclick="setBg('linear-gradient(135deg, #667eea, #764ba2)')" onkeydown="handleKeyClick(event, () => setBg('linear-gradient(135deg, #667eea, #764ba2)'))">🔮 퍼플 그라데이션</a>
      <a role="button" tabindex="0" class="btn-theme" onclick="setBg('linear-gradient(135deg, #11998e, #38ef7d)')" onkeydown="handleKeyClick(event, () => setBg('linear-gradient(135deg, #11998e, #38ef7d)'))">🌊 에메랄드 그라데이션</a>
    </div>

    <!-- 규격 및 배율 -->
    <div class="tool-group">
      <label for="aspect-ratio">비율:</label>
      <select id="aspect-ratio" onchange="changeAspectRatio(this.value)">
        <option value="custom">자유 조절</option>
        <option value="1:1">1:1</option>
        <option value="16:9" selected>16:9</option>
        <option value="4:5">4:5</option>
      </select>

      <label for="zoom-scale">배율:</label>
      <select id="zoom-scale" onchange="changeZoom(this.value)">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
      </select>
    </div>

    <!-- Undo / Redo 버튼 추가 -->
    <div class="tool-group">
      <button type="button" onclick="undo()" aria-label="실행 취소">↩ Undo (Ctrl+Z)</button>
      <button type="button" onclick="redo()" aria-label="다시 실행">↪ Redo (Ctrl+Y)</button>
    </div>

    <!-- 파일 관련 -->
    <div class="tool-group">
      <input type="file" id="json-input" accept=".json" style="display:none;" onchange="safeLoadJSON(this)">
      <button type="button" onclick="document.getElementById('json-input').click()">JSON 불러오기</button>
      <button type="button" onclick="exportJSON()">JSON 저장</button>
    </div>
  </div>

  <!-- 메인 작업 영역 -->
  <main>
    <div class="canvas-panel">
      <div class="panel-header">
        <span>작업 캔버스 (마우스 드래그 & 방향키 이동 가능)</span>
        <span>MAIN CANVAS</span>
      </div>
      <div class="canvas-body">
        <div id="main-canvas" tabindex="0">
          <!-- 오브젝트가 배치되는 영역 -->
        </div>
      </div>
    </div>

    <div class="preview-panel">
      <div class="panel-header">
        <span>실시간 미리보기</span>
        <span>LIVE PREVIEW</span>
      </div>
      <div class="canvas-body" style="background:#eee;">
        <div id="live-preview-box">미리보기 영역</div>
      </div>
    </div>
  </main>

  <footer>
    <div><span>[SYSTEM]</span> <span id="sys-msg">에디터 준비 완료. 방향키 및 단축키(Ctrl+Z/Ctrl+Y)가 지원됩니다.</span></div>
  </footer>
</div>

<script>
  // ==================================================
  // 3. Undo / Redo 상태 관리 로직
  // ==================================================
  const historyStack = [];
  let historyStep = -1;
  const MAX_HISTORY = 30;

  function getCurrentCanvasState() {
    const canvas = document.getElementById('main-canvas');
    return {
      background: canvas.style.background,
      aspectRatio: document.getElementById('aspect-ratio').value,
      zoom: document.getElementById('zoom-scale').value,
      innerHTML: canvas.innerHTML
    };
  }

  function recordState() {
    try {
      if (historyStep < historyStack.length - 1) {
        historyStack.splice(historyStep + 1);
      }
      historyStack.push(JSON.stringify(getCurrentCanvasState()));
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      } else {
        historyStep++;
      }
    } catch (e) {
      console.error("[QA Error] 상태 기록 실패:", e);
    }
  }

  function undo() {
    if (historyStep > 0) {
      historyStep--;
      applyCanvasState(historyStack[historyStep]);
      updateSysMsg("Undo(실행 취소)가 적용되었습니다.");
    }
  }

  function redo() {
    if (historyStep < historyStack.length - 1) {
      historyStep++;
      applyCanvasState(historyStack[historyStep]);
      updateSysMsg("Redo(다시 실행)가 적용되었습니다.");
    }
  }

  function applyCanvasState(jsonStr) {
    try {
      const state = JSON.parse(jsonStr);
      const canvas = document.getElementById('main-canvas');
      canvas.style.background = state.background || '#ffffff';
      canvas.innerHTML = state.innerHTML || '';
      document.getElementById('aspect-ratio').value = state.aspectRatio || '16:9';
      document.getElementById('zoom-scale').value = state.zoom || '1';
    } catch (e) {
      console.error("[QA Error] 상태 적용 중 예외 발생:", e);
    }
  }

  // Ctrl+Z / Ctrl+Y 키보드 이벤트
  window.addEventListener('keydown', (e) => {
    const activeEl = document.activeElement;
    const isEditingText = activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable;
    if (isEditingText) return; // 텍스트 편집 중에는 동작 차단

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (e.shiftKey) {
        redo();
      } else {
        undo();
      }
      e.preventDefault();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      redo();
      e.preventDefault();
    }
  });

  // ==================================================
  // 4. 접근성 키보드 클릭 핸들러 (Enter / Space)
  // ==================================================
  function handleKeyClick(event, callback) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      callback();
    }
  }

  // ==================================================
  // 5. 안전한 배경 변경 및 예외 처리 (Console Error 방지)
  // ==================================================
  function setBg(bgStyle) {
    try {
      const canvas = document.getElementById('main-canvas');
      canvas.style.background = bgStyle;
      recordState();
    } catch (e) {
      console.error("[QA Error] 배경 변경 중 오류 발생:", e);
    }
  }

  function changeAspectRatio(ratio) {
    try {
      const canvas = document.getElementById('main-canvas');
      if (ratio === '1:1') canvas.style.aspectRatio = '1 / 1';
      else if (ratio === '16:9') canvas.style.aspectRatio = '16 / 9';
      else if (ratio === '4:5') canvas.style.aspectRatio = '4 / 5';
      else canvas.style.aspectRatio = 'unset';
      recordState();
    } catch (e) {
      console.error("[QA Error] 화면비 변경 오류:", e);
    }
  }

  function changeZoom(scale) {
    try {
      const canvas = document.getElementById('main-canvas');
      canvas.style.transform = `scale(${scale})`;
      recordState();
    } catch (e) {
      console.error("[QA Error] 배율 변경 오류:", e);
    }
  }

  // JSON 로드 및 예외 안전 처리
  function safeLoadJSON(fileInput) {
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        applyCanvasState(e.target.result);
        recordState();
        updateSysMsg("JSON 파일을 성공적으로 불러왔습니다.");
      } catch (err) {
        console.error("[QA Error] 올바르지 않은 JSON 데이터:", err);
        alert("유효한 JSON 템플릿 파일이 아닙니다.");
      }
    };
    reader.onerror = function(err) {
      console.error("[QA Error] 파일 읽기 실패:", err);
    };
    reader.readAsText(file);
  }

  function exportJSON() {
    try {
      const state = getCurrentCanvasState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'template.json';
      a.click();
    } catch (e) {
      console.error("[QA Error] JSON 저장 실패:", e);
    }
  }

  function updateSysMsg(msg) {
    document.getElementById('sys-msg').innerText = msg;
  }

  // 초기 상태 저장
  window.onload = function() {
    recordState();
  };
</script>
</body>
</html>
